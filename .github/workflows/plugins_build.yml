name: Build plugins

on:
  push:
    branches:
      - termuj
    paths:
      - termuj/rename-to-termuj.py
      - termuj/debpkg.py
      - termuj/build-python-termuxgui-deb.py
      - .github/workflows/plugins_build.yml
  pull_request:
    branches:
      - termuj
    paths:
      - termuj/rename-to-termuj.py
      - termuj/debpkg.py
      - termuj/build-python-termuxgui-deb.py
      - .github/workflows/plugins_build.yml
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Latest official release tags of the Termux plugin apps, as "<name>:<tag or commit>" of github.com/termux/termux-<name>.
  # Termux:X11 only has a moving "nightly" tag, so the commit it pointed to is used.
  PLUGINS: "api:v0.53.0 boot:v0.8.1 float:v0.17.0 gui:0.1.6 styling:v0.32.1 tasker:v0.9.0 widget:v0.15.0 x11:6dfb8b4a4cc887bc329284d31eb049d596bd1208"
  # Latest tag of github.com/tareksander/termux-gui-python-bindings, the termuxgui Python module for Termux:GUI
  PYTHON_TERMUXGUI_TAG: "0.1.6"

jobs:
  termux-libraries:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.libraries.outputs.matrix }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build termux-shared libraries used by the plugins
        id: libraries
        shell: bash
        run: |
          set -euo pipefail

          # Each plugin release pins the termux-app commit of its termux-shared/terminal-view
          # dependencies (published by JitPack). Build those commits renamed to com.termuj.
          commits=""
          matrix=""
          for plugin in $PLUGINS; do
            name="${plugin%%:*}" tag="${plugin#*:}"
            git init -q "plugin-$name"
            git -C "plugin-$name" fetch -q --depth 1 "https://github.com/termux/termux-$name.git" "$tag"
            git -C "plugin-$name" checkout -q FETCH_HEAD
            commit="$(grep -oE "com\.termux\.termux-app:[a-z-]+:[0-9a-f]+" "plugin-$name/app/build.gradle" | head -n 1 | sed 's/.*://')" || true
            echo "termux-$name $tag: termux-app libraries ${commit:-not used}"
            [ -n "$commit" ] && commits+="$commit"$'\n'
            matrix+="${matrix:+,}{\"name\":\"$name\",\"tag\":\"$tag\"}"
          done
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"

          for commit in $(printf '%s' "$commits" | sort -u); do
            echo "Building termux-app $commit libraries"
            git clone -q --filter=blob:none --no-checkout https://github.com/termux/termux-app.git "termux-app-$commit"
            git -C "termux-app-$commit" checkout -q "$commit"
            python3 termuj/rename-to-termuj.py "termux-app-$commit"
            # Publish with the coordinates the renamed plugins depend on: com.termuj.termux-app:<library>:<commit>
            sed -i -E -e "s/^(\s*groupId = )'com\.termuj'/\1'com.termuj.termux-app'/" -e "s/^(\s*version = )'[^']*'/\1'$commit'/" \
              "termux-app-$commit"/{termux-shared,terminal-view,terminal-emulator}/build.gradle
            (cd "termux-app-$commit" && ./gradlew :terminal-emulator:publishReleasePublicationToMavenLocal \
              :terminal-view:publishReleasePublicationToMavenLocal :termux-shared:publishReleasePublicationToMavenLocal)
          done

          mkdir -p libraries
          [ -d ~/.m2/repository/com/termuj ] && cp -r ~/.m2/repository/com/termuj libraries/
          find libraries -name '*.pom'

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: termux-libraries
          path: libraries
          if-no-files-found: ignore

  plugin:
    needs: termux-libraries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.termux-libraries.outputs.matrix) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Download libraries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: termux-libraries
          path: libraries

      - name: Build termuj-${{ matrix.name }}-app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.m2/repository/com
          [ -d libraries/termuj ] && cp -r libraries/termuj ~/.m2/repository/com/

          git init -q plugin
          git -C plugin fetch -q --depth 1 "https://github.com/termux/termux-${{ matrix.name }}.git" "${{ matrix.tag }}"
          git -C plugin checkout -q FETCH_HEAD
          [ -f plugin/.gitmodules ] && git -C plugin submodule update -q --init --recursive --jobs 8 --depth 1
          python3 termuj/rename-to-termuj.py plugin
          sed -i -E 's|^(\s*)//\s*mavenLocal\(\)|\1mavenLocal()|' plugin/build.gradle

          # Termux:GUI requests CMake 3.10.2, which is neither on the runner nor installed by Gradle.
          if [ "${{ matrix.name }}" = gui ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.10.2.4988404" > /dev/null
          fi

          GRADLE_TASKS=(assembleDebug)
          APK_DIRS=(app/build/outputs/apk/debug)
          # Termux:X11: the standalone and sharedUid APKs, without the companion package of the termux-x11-nightly
          # package, whose (hexpatched) loader accepts them as they are signed with the same key as the Termux app.
          if [ "${{ matrix.name }}" = x11 ]; then
            GRADLE_TASKS=(:lorie-app:assembleStandaloneDebug :lorie-app:assembleSharedUidDebug)
            APK_DIRS=(lorie-app/build/outputs/apk/standalone/debug lorie-app/build/outputs/apk/sharedUid/debug)
          fi

          (cd plugin && ./gradlew "${GRADLE_TASKS[@]}")

          APK_DIR_PATH="apks"
          mkdir "$APK_DIR_PATH"
          for dir in "${APK_DIRS[@]}"; do cp plugin/"$dir"/*.apk "$APK_DIR_PATH/"; done
          (cd "$APK_DIR_PATH" && ls *.apk && sha256sum *.apk > checksums-sha256.txt && cat checksums-sha256.txt)
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termuj-${{ matrix.name }}-app_${{ matrix.tag }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/checksums-sha256.txt

  python-termuxgui:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build python-termuxgui package
        shell: bash
        run: |
          set -euo pipefail

          git clone -q --depth 1 -b "$PYTHON_TERMUXGUI_TAG" https://github.com/tareksander/termux-gui-python-bindings.git termuxgui

          # The module is installed in lib/python<major>.<minor>, so use the Python version of the Termux repository
          curl -fsSL --retry 5 -o Packages https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages
          PYTHON_VERSION="$(awk '/^Package: /{p = ($2 == "python")} p && /^Version: /{print $2; exit}' Packages | sed -E 's/^[0-9]+://' | grep -oE '^[0-9]+\.[0-9]+')"
          echo "Python version of the Termux repository: $PYTHON_VERSION"

          DEB_DIR_PATH="python-termuxgui"
          DEB_PATH="$(python3 termuj/build-python-termuxgui-deb.py termuxgui "$PYTHON_VERSION" "$DEB_DIR_PATH")"
          (cd "$DEB_DIR_PATH" && sha256sum *.deb > checksums-sha256.txt && cat checksums-sha256.txt)
          echo "DEB_DIR_PATH=$DEB_DIR_PATH" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_PATH" .deb)" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: |
            ${{ env.DEB_DIR_PATH }}/*.deb
            ${{ env.DEB_DIR_PATH }}/checksums-sha256.txt

  attach-to-release:
    if: github.event_name == 'release'
    needs: [plugin, python-termuxgui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download plugin APKs
        uses: actions/download-artifact@v4
        with:
          pattern: termuj-*-app_*
          path: artifacts

      - name: Download python-termuxgui package
        uses: actions/download-artifact@v4
        with:
          pattern: python-termuxgui_*
          path: artifacts

      - name: Attach plugin APKs and python-termuxgui package to release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION_NAME="${GITHUB_REF#refs/tags/}"
          mkdir assets
          for dir in artifacts/*/; do
            artifact="$(basename "$dir")"
            for file in "$dir"*.apk "$dir"*.deb; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              # Termux:GUI does not name its APK
              [ "$name" = app-debug.apk ] && name="${artifact}+debug.apk"
              [ -e "assets/$name" ] && { echo "Duplicate asset: $name"; exit 1; }
              cp "$file" "assets/$name"
            done
          done

          SHA256SUMS="termuj-plugins_${RELEASE_VERSION_NAME}_sha256sums"
          (cd assets && sha256sum * > "../$SHA256SUMS" && mv "../$SHA256SUMS" . && cat "$SHA256SUMS")
          gh release upload -R "$GITHUB_REPOSITORY" "$RELEASE_VERSION_NAME" assets/*
